name: macOS app

# Builds and releases the Mac app only (mac/MediaRemoteMac.xcodeproj). The iPhone app isn't built here
# yet; when it is, it gets its own workflow and its own release tags.
#
# Every pull request into main that touches the Mac app is built to make sure it compiles. Once it's
# merged, the same build is packaged and published as a GitHub release named after the Mac app's
# version (MARKETING_VERSION of the MediaRemoteMac target), tagged mac-v<version>. So each such pull
# request has to bump that version; the check fails if a release with it already exists.
on:
  pull_request:
    branches: [main]
    paths:
      - "mac/**"
      - "shared/**"
      - ".github/workflows/build-macos.yml"
  push:
    branches: [main]
    paths:
      - "mac/**"
      - "shared/**"
      - ".github/workflows/build-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(xcodebuild -project mac/MediaRemoteMac.xcodeproj -scheme MediaRemoteMac -configuration Release \
            -showBuildSettings 2>/dev/null | awk '/ MARKETING_VERSION = / { print $3; exit }')
          if [ -z "$version" ]; then
            echo "::error::Couldn't read MARKETING_VERSION from the Mac project."
            exit 1
          fi
          if gh release view "mac-v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Mac version $version has already been released. Bump the version (target MediaRemoteMac → General → Version) before merging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Builds a universal app (Apple Silicon + Intel). The helper dylib is built too because the app
      # target depends on it and embeds it in Contents/Frameworks. The generic destination is what makes
      # it universal: without one, xcodebuild picks the runner's own Mac and builds only arm64, ARCHS or not.
      - name: Build
        run: |
          xcodebuild -project mac/MediaRemoteMac.xcodeproj -scheme MediaRemoteMac -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      # Releases are signed with the project's own self-signed certificate, so the app keeps the same
      # identity from one version to the next and macOS remembers the permissions it was given
      # (Accessibility, Local Network). It's not a certificate Apple vouches for, so Gatekeeper still
      # asks once on first launch. Without the secrets (e.g. pull requests from forks) the app is signed
      # ad hoc instead. The helper is signed first: the app's signature covers it.
      - name: Sign
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          app=build/DerivedData/Build/Products/Release/MediaRemoteMac.app
          helper="$app/Contents/Frameworks/libMediaRemoteHelper.dylib"
          if [ -n "$CERTIFICATE_P12" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            keychain_password=$(openssl rand -hex 16)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 3600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
            rm "$RUNNER_TEMP/certificate.p12"
            # A self-signed certificate isn't trusted, so codesign won't find it by name; pick the one
            # just imported by its hash, and put the keychain on the search list so codesign looks there.
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            identity=$(security find-certificate -a -Z "$keychain" | awk '/SHA-1 hash:/ { print $NF; exit }')
            codesign --force --keychain "$keychain" --sign "$identity" "$helper"
            codesign --force --keychain "$keychain" --sign "$identity" "$app"
          else
            echo "::warning::No signing certificate configured, signing ad hoc."
            codesign --force --sign - "$helper"
            codesign --force --sign - "$app"
          fi
          codesign --verify --strict --deep "$app"
          codesign --display --requirements - "$app"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Verify macOS architectures
        run: |
          app=build/DerivedData/Build/Products/Release/MediaRemoteMac.app
          app_binary="$app/Contents/MacOS/MediaRemoteMac"
          helper="$app/Contents/Frameworks/libMediaRemoteHelper.dylib"
          for binary in "$app_binary" "$helper"; do
            info=$(lipo -info "$binary")
            echo "$info"
            if [[ "$info" != *"arm64"* || "$info" != *"x86_64"* ]]; then
              echo "::error::Missing arm64/x86_64 slice in $binary"
              exit 1
            fi
          done

      - name: Package
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/MediaRemoteMac.app MediaRemoteMac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MediaRemoteMac
          path: MediaRemoteMac.zip

  release:
    name: Release (macOS)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MediaRemoteMac

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "mac-v$VERSION" MediaRemoteMac.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Media Remote for Mac $VERSION" --generate-notes \
            --notes "The Mac app (universal: Apple Silicon + Intel). Unzip and move **MediaRemoteMac.app** to Applications, then install the iPhone app from Xcode.

          This build isn't notarized, so macOS blocks it the first time. Open it once, then go to *System Settings → Privacy & Security* and click **Open Anyway**. Or run \`xattr -dr com.apple.quarantine /Applications/MediaRemoteMac.app\` in Terminal."
